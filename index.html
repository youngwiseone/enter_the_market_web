<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Enter The Market (Web)</title>
    <!-- 98.css for a Windows 98 look -->
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.16/dist/98.css">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --grid-size: 580px;
            --messages-height: clamp(72px, 14vh, 112px);
            --bottom-bar-height: 170px;
            --font-ui: clamp(13px, 1.8vw, 16px);
            --font-table: clamp(12px, 1.6vw, 15px);
            --font-title: clamp(14px, 2.2vw, 18px);
            --font-button: clamp(14px, 2.4vw, 20px);
        }
        body {
            background-color: #c0c0c0;
            margin: 0;
            padding: calc(10px + var(--safe-top)) calc(10px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(10px + var(--safe-left));
            font-family: 'MS Sans Serif', sans-serif;
            font-size: var(--font-ui);
            --energy-fill: #00a2ff;
            --energy-empty: #bcbcbc;
            min-height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }
        #hud {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        #tabs {
            display: flex;
            gap: 4px;
        }
        #store {
            display: none;
        }
        #goals-panel {
            display: none;
            margin: 0;
        }
        .goal-status-completed {
            font-weight: bold;
            color: #006400;
        }
        .goal-status-progress {
            color: #5a3a00;
        }
        .panel {
            background-color: #d4d0c8;
            border: 1px solid #808080;
            padding: 8px;
        }
        #shop-table, #inventory-table {
            width: 100%;
        }
        #chat-area {
            margin-top: 8px;
            background-color: black;
            color: lime;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            padding: 4px;
        }
        #store-tabs button {
            display: block;
            width: 100%;
            margin-bottom: 4px;
        }

        #hud span {
            margin-right: 16px;
        }

        /*
         * Theme definitions
         *
         * To approximate the different colour schemes from the original
         * Pygame version, we define CSS classes that override the
         * background and text colours for the page and panels. When the
         * player selects a theme in the store, the corresponding
         * class is applied to the <body> element (see applyTheme in
         * main.js). Only a few key colours are overridden here; you can
         * extend these rules to include buttons, borders and other
         * components for a richer effect.
         */
        body.theme-default {
            background-color: #c0c0c0;
            color: #000;
        --header-bg: #000080;
        --header-fg: #ffffff;
        --header-border: #808080;
        --secondary-color: #0078d7;
        }
        body.theme-default .panel {
            background-color: #d4d0c8;
            border-color: #808080;
            color: #000;
        }

        body.theme-mono {
            background-color: #003100;
            color: #00ff00;
        --header-bg: #004000;
        --header-fg: #00ff00;
        --header-border: #006400;
        --secondary-color: #00aa00;
        }
        body.theme-mono .panel {
            background-color: #011a00;
            border-color: #006400;
            color: #00ff00;
        }

        body.theme-aqua {
            background-color: #002444;
            color: #59c3c3;
        --header-bg: #003e80;
        --header-fg: #59c3c3;
        --header-border: #003e80;
        --secondary-color: #59c3c3;
        }
        body.theme-aqua .panel {
            background-color: #003366;
            border-color: #003e80;
            color: #59c3c3;
        }

        body.theme-flame {
            background-color: #230000;
            color: #ffa500;
        --header-bg: #550000;
        --header-fg: #ffa500;
        --header-border: #dd5500;
        --secondary-color: #ff7300;
        }
        body.theme-flame .panel {
            background-color: #441010;
            border-color: #dd5500;
            color: #ffa500;
        }

        body.theme-coder {
            background-color: #000000;
            color: #0aff0a;
        --header-bg: #333333;
        --header-fg: #0aff0a;
        --header-border: #333333;
        --secondary-color: #0aff0a;
        }
        body.theme-coder .panel {
            background-color: #0d0d0d;
            border-color: #333333;
            color: #0aff0a;
        }

        body.theme-hotdog {
            background-color: #FFD800;
            color: #000;
        --header-bg: #220000;
        --header-fg: #000000;
        --header-border: #220000;
        --secondary-color: #220000;
        }
        body.theme-hotdog .panel {
            background-color: #FF2800;
            border-color: #220000;
            color: #000;
        }

        body.theme-teal {
            background-color: #004d4d;
            color: #f0ffff;
        --header-bg: #008080;
        --header-fg: #f0ffff;
        --header-border: #008080;
        --secondary-color: #00d0d0;
        }
        body.theme-teal .panel {
            background-color: #006666;
            border-color: #008080;
            color: #f0ffff;
        }

        /* Panel title styling for the messages area */
        .panel-title {
            background: linear-gradient(90deg, var(--header-bg, #000080), var(--secondary-color, #0078d7));
            color: var(--header-fg, white);
            padding: 4px 6px;
            font-weight: bold;
            border-bottom: 1px solid var(--header-border, #808080);
            font-size: var(--font-title);
        }

        /* Zebra table styling and sticky header */
        .zebra-table {
            border-collapse: collapse;
            width: 100%;
        }
        .zebra-table th,
        .zebra-table td {
            padding: 2px 4px;
            border: 1px solid var(--header-border, #808080);
            font-size: var(--font-table);
        }
        .zebra-table tr:nth-child(even) {
            background-color: #f0f0f0;
        }
        .zebra-table tr:nth-child(odd) {
            background-color: #ffffff;
        }
        .zebra-table th {
            background-color: var(--header-bg, #000080);
            color: var(--header-fg, #ffffff);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .market-row-selected { 
            outline: 2px solid var(--secondary-color, #0078d7); 
            outline-offset: -2px; 
        } 
        .market-row-pulse { 
            animation: fx-row-pulse 220ms ease-out; 
        } 
        @keyframes fx-row-pulse { 
            0% { background-color: #fff4b0; } 
            100% { background-color: inherit; } 
        } 

        /* Farm styling for the Minesweeper‑like 9×9 board used in the Farmer's Market tab */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid var(--header-border, #808080);
            cursor: inherit;
        }
        .grid-cell { 
            box-sizing: border-box; 
            /* 3D button style reminiscent of Windows 98: light top/left, dark bottom/right */
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: inherit;
            user-select: none;
            position: relative; 
            overflow: hidden; 
            transition: transform 80ms ease-out, box-shadow 80ms ease-out; 
        } 
        @media (hover: hover) and (pointer: fine) { 
            .grid-cell:hover { 
                transform: translateY(-1px); 
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 0 rgba(0, 0, 0, 0.15); 
            } 
        } 
        .grid-cell.revealed {
            /* Invert bevel to appear sunken when revealed */
            background-color: #663931;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .grid-cell img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .grid-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 2;
        }
        .rarity-border {
            box-shadow: inset 0 0 0 3px var(--rarity-color, #ffffff);
        }
        .rarity-frame {
            position: absolute;
            inset: 0;
            border: 3px solid var(--rarity-color, #ffffff);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 4;
        }
        .rarity-common {
            --rarity-color: #ffffff;
        }
        .rarity-uncommon {
            --rarity-color: #c0c0c0;
        }
        .rarity-rare {
            --rarity-color: #d4af37;
        }
        .rarity-mythic { 
            --rarity-color: #a855f7; 
        } 
        .grid-cell.rarity-rare::after { 
            content: ''; 
            position: absolute; 
            inset: -20%; 
            background: linear-gradient( 
                120deg, 
                rgba(255, 255, 255, 0), 
                rgba(255, 255, 255, 0.45), 
                rgba(255, 255, 255, 0) 
            ); 
            opacity: 0.35; 
            transform: translateX(-60%); 
            animation: fx-shimmer 3s linear infinite; 
            pointer-events: none; 
            mix-blend-mode: screen; 
        } 
        .rarity-holo { 
            position: absolute; 
            inset: 1px; 
            pointer-events: none; 
            z-index: 3; 
            background: linear-gradient(
                120deg,
                rgba(168, 85, 247, 0.0),
                rgba(168, 85, 247, 0.35),
                rgba(120, 60, 200, 0.6),
                rgba(168, 85, 247, 0.35),
                rgba(168, 85, 247, 0.0)
            );
            background-size: 200% 200%;
            mix-blend-mode: screen;
            animation: holo-shine 3.5s linear infinite;
        }
        @keyframes holo-shine { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        } 
        @keyframes fx-shimmer { 
            0% { transform: translateX(-70%); } 
            100% { transform: translateX(70%); } 
        } 
        .farm-toolbar {
            display: flex;
            gap: 4px;
            margin: 4px 0;
            width: 100%;
            max-width: var(--grid-size, 580px);
            box-sizing: border-box;
            align-items: center;
        }
        .tool-button {
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
        }
        .tool-button.active {
            background-color: #c0c0c0;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .tool-button img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .progress-indicator {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            border-radius: 0;
            box-shadow: inset -2px -2px #dfdfdf, inset 2px 2px grey;
            height: 32px;
            padding: 4px;
            position: relative;
            background-color: #c0c0c0;
            display: flex;
        }
        .farm-toolbar .progress-indicator {
            padding: 2px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .energy-segment {
            flex: 1 1 0;
            background-color: var(--energy-empty);
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff;
        }
        .energy-segment.filled {
            background-color: var(--energy-fill);
        }
        .chat-row {
            display: flex;
            gap: 0;
            align-items: stretch;
            height: var(--messages-height, 88px);
        }
        .chat-avatar {
            width: var(--messages-height, 88px);
            height: 100%;
            flex: 0 0 var(--messages-height, 88px);
            display: block;
        }
        .market-header {
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #market-header > span {
            display: none;
        }
        .market-stats {
            display: flex;
            gap: 12px;
            font-size: var(--font-ui);
            margin-top: 4px;
        }
        .market-tabs {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .tab-button {
            padding: 4px 10px;
            font-size: var(--font-ui);
            background-color: #c0c0c0;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            min-height: 44px;
        }
        .tab-button.active {
            background-color: #d4d0c8;
            border-bottom-color: #d4d0c8;
        }
        #market-layout {
            display: grid;
            grid-template-columns: minmax(max(280px, 33vw), var(--grid-size, 580px)) minmax(0, 1fr);
            grid-template-areas:
                "farm side";
            gap: 8px;
            align-items: stretch;
            position: relative;
            height: calc(100dvh - (20px + var(--safe-top) + var(--safe-bottom)));
            overflow: hidden;
        }
        #farm-panel {
            grid-area: farm;
            position: relative;
            align-self: start;
            z-index: 20;
        }
        #market {
            grid-area: side;
        }
        #market {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            min-height: 0;
            overflow-y: auto;
            padding-bottom: calc(var(--bottom-bar-height, 170px) + 8px);
            box-sizing: border-box;
        }
        #market-table-container {
            max-height: none;
            overflow: visible;
            margin: 0;
        }
        #store {
            display: none;
        }
        #bottom-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 35;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 168px;
            gap: 8px;
            align-items: stretch;
            pointer-events: none;
        }
        #messages-panel {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-self: stretch;
            min-height: 0;
            pointer-events: auto;
            background-color: #d4d0c8;
        }
        .messages-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 4px 6px;
            border-bottom: 1px solid #808080;
            font-size: clamp(11px, 1.6vw, 13px);
        }
        .messages-controls label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            border: 1px solid #808080;
            padding: 1px 6px;
            background-color: #cfcfcf;
            color: #222;
        }
        .messages-controls label.filter-on {
            background-color: #0f2f0f;
            color: #8cff8c;
            border-color: #4f8f4f;
        }
        .messages-controls label.filter-off {
            background-color: #3a1010;
            color: #ff9f9f;
            border-color: #a05050;
        }
        .messages-controls #chat-unread-chip {
            margin-left: auto;
        }
        #chat-unread-chip {
            display: none;
            padding: 0 6px;
            min-height: 22px;
            font-size: clamp(11px, 1.5vw, 12px);
            white-space: nowrap;
        }
        #chat-log {
            height: 100% !important;
            font-size: clamp(12px, 1.9vw, 15px);
            box-sizing: border-box;
        }
        .chat-entry {
            margin: 0 0 2px;
        }
        .chat-summary {
            border: 1px solid #7f9db9;
            background-color: rgba(20, 20, 20, 0.6);
            padding: 2px 4px;
        }
        .chat-summary > summary {
            cursor: pointer;
        }
        .chat-summary ul {
            margin: 4px 0 0 18px;
            padding: 0;
        }
        #next-day {
            font-size: var(--font-button);
            min-height: 44px;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            white-space: normal;
            line-height: 1.1;
            text-align: center;
        }
        #next-day .next-day-label + .next-day-label {
            margin-left: 0.35em;
        }
        #store {
            margin: 0;
        }
        #grid-container {
            width: var(--grid-size, 580px);
            height: var(--grid-size, 580px);
            max-width: 100%;
        }
        @media (max-width: 900px) {
            :root {
                --messages-height: clamp(56px, 10vh, 78px);
            }
            #market-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                grid-template-areas:
                    "farm"
                    "side";
            }
            #farm-panel {
                position: relative;
            }
            #grid-container {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
            #bottom-bar {
                grid-template-columns: minmax(0, 1fr) 86px;
            }
            #next-day {
                flex-direction: column;
                gap: 0;
            }
            #next-day .next-day-label + .next-day-label {
                margin-left: 0;
            }
            .tool-button {
                width: 44px;
                height: 44px;
            }
            .tool-button img {
                width: 28px;
                height: 28px;
            }
            .progress-indicator {
                height: 44px;
            }
        }
        @media (hover: none) and (pointer: coarse) { 
            :root { 
                --font-ui: clamp(14px, 2.6vw, 18px); 
                --font-table: clamp(13px, 2.2vw, 16px); 
                --font-title: clamp(15px, 3vw, 20px); 
                --font-button: clamp(15px, 3.2vw, 22px); 
            } 
        } 
        .fx-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 30; 
        } 
        .fx-pop { 
            animation: fx-pop 160ms ease-out; 
        } 
        .fx-shake { 
            animation: fx-shake 120ms ease-in-out; 
        } 
        .fx-wobble { 
            animation: fx-wobble 180ms ease-in-out; 
        } 
        .fx-pulse-up { 
            animation: fx-pulse-up 260ms ease-out; 
        } 
        .fx-pulse-down { 
            animation: fx-pulse-down 260ms ease-out; 
        } 
        .fx-fade-up { 
            animation: fx-fade-up 600ms ease-out; 
        } 
        .fx-camera-nudge { 
            animation: fx-camera-nudge 160ms ease-out; 
        } 
        .fx-day-wipe { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.6) 40%, rgba(255, 255, 255, 0) 100%); 
            opacity: 0; 
            z-index: 40; 
            animation: fx-day-wipe 220ms ease-out; 
            pointer-events: none; 
        } 
        .fx-panel-tint { 
            animation: fx-panel-tint 260ms ease-out; 
        } 
        .fx-floating-text { 
            position: absolute; 
            pointer-events: none; 
            font-size: 12px; 
            color: #ffe680; 
            text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, 0.45); 
            z-index: 35; 
        } 
        @keyframes fx-pop { 
            0% { transform: scale(1); } 
            40% { transform: scale(1.15); } 
            100% { transform: scale(1); } 
        } 
        @keyframes fx-shake { 
            0% { transform: translate(0, 0); } 
            20% { transform: translate(-2px, 1px); } 
            40% { transform: translate(2px, -1px); } 
            60% { transform: translate(-1px, -2px); } 
            80% { transform: translate(1px, 2px); } 
            100% { transform: translate(0, 0); } 
        } 
        @keyframes fx-wobble { 
            0% { transform: rotate(0deg); } 
            25% { transform: rotate(-2deg); } 
            50% { transform: rotate(2deg); } 
            75% { transform: rotate(-1deg); } 
            100% { transform: rotate(0deg); } 
        } 
        @keyframes fx-pulse-up { 
            0% { transform: translateY(0); color: inherit; } 
            40% { transform: translateY(-2px); color: #2f9e44; } 
            100% { transform: translateY(0); color: inherit; } 
        } 
        @keyframes fx-pulse-down { 
            0% { transform: translateY(0); color: inherit; } 
            40% { transform: translateY(2px); color: #c92a2a; } 
            100% { transform: translateY(0); color: inherit; } 
        } 
        @keyframes fx-fade-up { 
            0% { opacity: 0; transform: translateY(6px); } 
            20% { opacity: 1; } 
            100% { opacity: 0; transform: translateY(-10px); } 
        } 
        @keyframes fx-camera-nudge { 
            0% { transform: translate(0, 0); } 
            40% { transform: translate(2px, -2px); } 
            100% { transform: translate(0, 0); } 
        } 
        @keyframes fx-day-wipe { 
            0% { opacity: 0; } 
            40% { opacity: 1; } 
            100% { opacity: 0; } 
        } 
        @keyframes fx-panel-tint { 
            0% { filter: none; } 
            40% { filter: brightness(1.04) saturate(1.08); } 
            100% { filter: none; } 
        } 
        @media (prefers-reduced-motion: reduce) { 
            .fx-pop, .fx-shake, .fx-wobble, .fx-pulse-up, .fx-pulse-down, .fx-fade-up, .fx-camera-nudge, .fx-day-wipe, .fx-panel-tint { 
                animation: none !important; 
            } 
            .grid-cell.rarity-rare::after, .rarity-holo { 
                animation: none !important; 
            } 
        } 
    </style> 
</head>
<body>    
    <div id="market-layout">
        <!-- Farmer's Market content consists of a single unified table and a 9×9 farm. The farm sits on the left and the market table on the right. -->
        <div id="farm-panel" class="panel">
            <!-- Side container holds the grid -->
                <!-- Interactive grid area. -->
                <div class="panel-title">Farm</div>
                <div class="farm-toolbar" aria-label="Farm tools">
                    <button class="tool-button active" data-tool="glove" title="Gloves">
                        <img src="resources/tools/glove.png" alt="Gloves">
                    </button>
                    <button class="tool-button" data-tool="watering" title="Watering can">
