<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Enter The Market (Web)</title>
    <!-- 98.css for a Windows 98 look -->
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.16/dist/98.css">
    <style>
        body {
            background-color: #c0c0c0;
            padding: 10px;
            font-family: 'MS Sans Serif', sans-serif;
            --energy-fill: #00a2ff;
            --energy-empty: #bcbcbc;
        }
        #hud {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        #tabs {
            display: flex;
            gap: 4px;
        }
        #market, #store {
            display: none;
        }
        .panel {
            background-color: #d4d0c8;
            border: 1px solid #808080;
            padding: 8px;
        }
        #shop-table, #inventory-table {
            width: 100%;
        }
        #chat-area {
            margin-top: 8px;
            background-color: black;
            color: lime;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            padding: 4px;
        }
        #store-tabs button {
            display: block;
            width: 100%;
            margin-bottom: 4px;
        }

        #hud span {
            margin-right: 16px;
        }

        /*
         * Theme definitions
         *
         * To approximate the different colour schemes from the original
         * Pygame version, we define CSS classes that override the
         * background and text colours for the page and panels. When the
         * player selects a theme in the store, the corresponding
         * class is applied to the <body> element (see applyTheme in
         * main.js). Only a few key colours are overridden here; you can
         * extend these rules to include buttons, borders and other
         * components for a richer effect.
         */
        body.theme-default {
            background-color: #c0c0c0;
            color: #000;
        --header-bg: #000080;
        --header-fg: #ffffff;
        --header-border: #808080;
        --secondary-color: #0078d7;
        }
        body.theme-default .panel {
            background-color: #d4d0c8;
            border-color: #808080;
            color: #000;
        }

        body.theme-mono {
            background-color: #003100;
            color: #00ff00;
        --header-bg: #004000;
        --header-fg: #00ff00;
        --header-border: #006400;
        --secondary-color: #00aa00;
        }
        body.theme-mono .panel {
            background-color: #011a00;
            border-color: #006400;
            color: #00ff00;
        }

        body.theme-aqua {
            background-color: #002444;
            color: #59c3c3;
        --header-bg: #003e80;
        --header-fg: #59c3c3;
        --header-border: #003e80;
        --secondary-color: #59c3c3;
        }
        body.theme-aqua .panel {
            background-color: #003366;
            border-color: #003e80;
            color: #59c3c3;
        }

        body.theme-flame {
            background-color: #230000;
            color: #ffa500;
        --header-bg: #550000;
        --header-fg: #ffa500;
        --header-border: #dd5500;
        --secondary-color: #ff7300;
        }
        body.theme-flame .panel {
            background-color: #441010;
            border-color: #dd5500;
            color: #ffa500;
        }

        body.theme-coder {
            background-color: #000000;
            color: #0aff0a;
        --header-bg: #333333;
        --header-fg: #0aff0a;
        --header-border: #333333;
        --secondary-color: #0aff0a;
        }
        body.theme-coder .panel {
            background-color: #0d0d0d;
            border-color: #333333;
            color: #0aff0a;
        }

        body.theme-hotdog {
            background-color: #FFD800;
            color: #000;
        --header-bg: #220000;
        --header-fg: #000000;
        --header-border: #220000;
        --secondary-color: #220000;
        }
        body.theme-hotdog .panel {
            background-color: #FF2800;
            border-color: #220000;
            color: #000;
        }

        body.theme-teal {
            background-color: #004d4d;
            color: #f0ffff;
        --header-bg: #008080;
        --header-fg: #f0ffff;
        --header-border: #008080;
        --secondary-color: #00d0d0;
        }
        body.theme-teal .panel {
            background-color: #006666;
            border-color: #008080;
            color: #f0ffff;
        }

        /* Panel title styling for the messages area */
        .panel-title {
            background: linear-gradient(90deg, var(--header-bg, #000080), var(--secondary-color, #0078d7));
            color: var(--header-fg, white);
            padding: 4px 6px;
            font-weight: bold;
            border-bottom: 1px solid var(--header-border, #808080);
            font-size: 0.9rem;
        }

        /* Zebra table styling and sticky header */
        .zebra-table {
            border-collapse: collapse;
            width: 100%;
        }
        .zebra-table th,
        .zebra-table td {
            padding: 2px 4px;
            border: 1px solid var(--header-border, #808080);
            font-size: 0.8rem;
        }
        .zebra-table tr:nth-child(even) {
            background-color: #f0f0f0;
        }
        .zebra-table tr:nth-child(odd) {
            background-color: #ffffff;
        }
        .zebra-table th {
            background-color: var(--header-bg, #000080);
            color: var(--header-fg, #ffffff);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .market-row-selected {
            outline: 2px solid var(--secondary-color, #0078d7);
            outline-offset: -2px;
        }

        /* Farm styling for the Minesweeper‑like 9×9 board used in the Farmer's Market tab */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid var(--header-border, #808080);
            cursor: inherit;
        }
        .grid-cell {
            box-sizing: border-box;
            /* 3D button style reminiscent of Windows 98: light top/left, dark bottom/right */
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: inherit;
            user-select: none;
            position: relative;
        }
        .grid-cell.revealed {
            /* Invert bevel to appear sunken when revealed */
            background-color: #663931;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .grid-cell img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .grid-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 2;
        }
        .farm-toolbar {
            display: flex;
            gap: 4px;
            margin: 4px 0;
            width: 600px;
            box-sizing: border-box;
            align-items: center;
        }
        .tool-button {
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
        }
        .tool-button.active {
            background-color: #c0c0c0;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .tool-button img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .progress-indicator {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            border-radius: 0;
            box-shadow: inset -2px -2px #dfdfdf, inset 2px 2px grey;
            box-sizing: border-box;
            height: 32px;
            padding: 4px;
            position: relative;
            background-color: #c0c0c0;
            display: flex;
            gap: 2px;
        }
        .farm-toolbar .progress-indicator {
            height: 24px;
            padding: 2px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .energy-segment {
            flex: 1 1 0;
            background-color: var(--energy-empty);
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff;
        }
        .energy-segment.filled {
            background-color: var(--energy-fill);
        }
        .chat-row {
            display: flex;
            gap: 0;
            align-items: flex-start;
        }
        .chat-avatar {
            width: 88px;
            height: 88px;
            flex: 0 0 88px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="hud">
        <span id="hud-day">Day 1</span>
        <span id="hud-cash">$0.00</span>
        <span id="hud-networth">Net Worth: $0.00</span>
        <div id="tabs">
            <button id="tab-market" class="button">Farmer&#39;s Market</button>
            <button id="tab-store" class="button">Store</button>
        </div>
        <button id="next-day" class="button" style="margin-left: 8px;">Next Day</button>
    </div>
    <div id="market" class="panel">
        <!-- Farmer's Market content consists of a single unified table and a 9×9 farm. The farm sits on the left and the market table on the right. -->
        <div id="market-content" style="display: flex; gap: 4px;">
            <!-- Side container holds the grid -->
            <div id="side-container" style="display: flex; flex-direction: column;">
                <!-- Interactive grid area. This container is fixed to 600×600 pixels to ensure a square
                     9×9 grid. The grid itself will fill the container. -->
                <div class="panel-title">Farm</div>
                <div class="farm-toolbar" aria-label="Farm tools">
                    <button class="tool-button active" data-tool="glove" title="Gloves">
                        <img src="resources/tools/glove.png" alt="Gloves">
                    </button>
                    <button class="tool-button" data-tool="watering" title="Watering can">
                        <img src="resources/tools/watering_can.png" alt="Watering can">
                    </button>
                    <button class="tool-button" data-tool="pickaxe" title="Pickaxe">
                        <img src="resources/tools/pickaxe.png" alt="Pickaxe">
                    </button>
                    <div id="energy-bar" class="progress-indicator" role="progressbar" aria-valuemin="0"></div>
                </div>
                <div id="grid-container" style="width: 600px; height: 600px;">
                    <div id="grid" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
            <!-- Combined market table -->
            <div id="market-table-container" style="flex: 1 1 60%; max-height: 326px; overflow-y: auto;">
                <div class="panel-title">Farmer&#39;s Market</div>
                <div id="market-table"></div>
            </div>
        </div>
        <!-- Messages panel -->
        <div id="messages-panel" style="margin-top: 32px;">
            <div class="panel-title">Messages</div>
            <div class="chat-row">
                <img id="chat-profile" class="chat-avatar" src="resources/profiles/player.png" alt="player neutral">
                <div id="chat-log" style="background-color: black; color: lime; font-family: monospace; height: 80px; overflow-y: auto; padding: 4px; flex: 1 1 auto;"></div>
            </div>
        </div>
    </div>
    <div id="store" class="panel">
        <div id="store-tabs" style="width: 140px; float: left;">
            <button id="store-cosmetics" class="button">Cosmetics</button>
            <button id="store-crafting" class="button">Crafting</button>
        </div>
        <div id="store-content" style="margin-left: 150px;"></div>
        <div style="clear: both;"></div>
        <button id="reset-game" class="button" style="margin-top: 8px;">Reset Game</button>
    </div>
    <!-- Append a version query string to bust browser caching of the script. Update the version number when making changes to main.js. -->
    <!-- Update the version query string when modifying main.js to prevent browser caching -->
    <!-- Bump the version number each time main.js changes to ensure browsers reload the script -->
    <!-- Load the game logic. Update the version query string whenever main.js changes to ensure the latest file is fetched. -->
    <script src="main.js?v=36"></script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1565723ff66a4156b0b14b3ada223aa5"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
