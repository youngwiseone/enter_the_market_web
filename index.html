<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Enter The Market (Web)</title>
    <!-- 98.css for a Windows 98 look -->
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.16/dist/98.css">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --grid-size: 580px;
            --messages-height: clamp(108px, 21vh, 168px);
            --bottom-bar-height: 170px;
            --font-ui: clamp(13px, 1.8vw, 16px);
            --font-table: clamp(12px, 1.6vw, 15px);
            --font-title: clamp(14px, 2.2vw, 18px);
            --font-button: clamp(14px, 2.4vw, 20px);
        }
        body {
            background-color: #c0c0c0;
            margin: 0;
            padding: calc(10px + var(--safe-top)) calc(10px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(10px + var(--safe-left));
            font-family: 'MS Sans Serif', sans-serif;
            font-size: var(--font-ui);
            --energy-fill: #00a2ff;
            --energy-empty: #bcbcbc;
            min-height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }
        #hud {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        #tabs {
            display: flex;
            gap: 4px;
        }
        #store {
            display: none;
        }
        #goals-panel {
            display: none;
            margin: 0;
        }
        .goal-status-completed {
            font-weight: bold;
            color: #006400;
        }
        .goal-status-progress {
            color: #5a3a00;
        }
        .panel {
            background-color: #d4d0c8;
            border: 1px solid #808080;
            padding: 8px;
        }
        #shop-table, #inventory-table {
            width: 100%;
        }
        #chat-area {
            margin-top: 8px;
            background-color: black;
            color: lime;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            padding: 4px;
        }
        #store-tabs button {
            display: block;
            width: 100%;
            margin-bottom: 4px;
        }

        #hud span {
            margin-right: 16px;
        }

        /*
         * Theme definitions
         *
         * To approximate the different colour schemes from the original
         * Pygame version, we define CSS classes that override the
         * background and text colours for the page and panels. When the
         * player selects a theme in the store, the corresponding
         * class is applied to the <body> element (see applyTheme in
         * main.js). Only a few key colours are overridden here; you can
         * extend these rules to include buttons, borders and other
         * components for a richer effect.
         */
        body.theme-default {
            background-color: #c0c0c0;
            color: #000;
        --header-bg: #000080;
        --header-fg: #ffffff;
        --header-border: #808080;
        --secondary-color: #0078d7;
        }
        body.theme-default .panel {
            background-color: #d4d0c8;
            border-color: #808080;
            color: #000;
        }

        body.theme-mono {
            background-color: #003100;
            color: #00ff00;
        --header-bg: #004000;
        --header-fg: #00ff00;
        --header-border: #006400;
        --secondary-color: #00aa00;
        }
        body.theme-mono .panel {
            background-color: #011a00;
            border-color: #006400;
            color: #00ff00;
        }

        body.theme-aqua {
            background-color: #002444;
            color: #59c3c3;
        --header-bg: #003e80;
        --header-fg: #59c3c3;
        --header-border: #003e80;
        --secondary-color: #59c3c3;
        }
        body.theme-aqua .panel {
            background-color: #003366;
            border-color: #003e80;
            color: #59c3c3;
        }

        body.theme-flame {
            background-color: #230000;
            color: #ffa500;
        --header-bg: #550000;
        --header-fg: #ffa500;
        --header-border: #dd5500;
        --secondary-color: #ff7300;
        }
        body.theme-flame .panel {
            background-color: #441010;
            border-color: #dd5500;
            color: #ffa500;
        }

        body.theme-coder {
            background-color: #000000;
            color: #0aff0a;
        --header-bg: #333333;
        --header-fg: #0aff0a;
        --header-border: #333333;
        --secondary-color: #0aff0a;
        }
        body.theme-coder .panel {
            background-color: #0d0d0d;
            border-color: #333333;
            color: #0aff0a;
        }

        body.theme-hotdog {
            background-color: #FFD800;
            color: #000;
        --header-bg: #220000;
        --header-fg: #000000;
        --header-border: #220000;
        --secondary-color: #220000;
        }
        body.theme-hotdog .panel {
            background-color: #FF2800;
            border-color: #220000;
            color: #000;
        }

        body.theme-teal {
            background-color: #004d4d;
            color: #f0ffff;
        --header-bg: #008080;
        --header-fg: #f0ffff;
        --header-border: #008080;
        --secondary-color: #00d0d0;
        }
        body.theme-teal .panel {
            background-color: #006666;
            border-color: #008080;
            color: #f0ffff;
        }

        body.theme-sophisticated {
            color: #f2f3f5;
            background:
                radial-gradient(circle at 12% 8%, rgba(197, 178, 138, 0.15), transparent 34%),
                radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.06), transparent 26%),
                linear-gradient(145deg, #15181e 0%, #1b1e24 55%, #202631 100%);
            --header-bg: #1f2530;
            --header-fg: #f2f3f5;
            --header-border: #4e5666;
            --secondary-color: #c5b28a;
            --theme-glow: rgba(197, 178, 138, 0.35);
            --theme-overlay: linear-gradient(110deg, rgba(255, 255, 255, 0), rgba(255, 250, 238, 0.26), rgba(255, 255, 255, 0));
            --theme-sparkle: rgba(250, 237, 206, 0.88);
            --theme-table-even: rgba(42, 47, 56, 0.95);
            --theme-table-odd: rgba(31, 36, 46, 0.95);
            --theme-table-text: #f3f4f7;
        }
        body.theme-sophisticated .panel {
            background: linear-gradient(180deg, rgba(43, 48, 58, 0.94) 0%, rgba(34, 39, 47, 0.98) 100%);
            border-color: #6b7587;
            color: #f2f3f5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 16px rgba(0, 0, 0, 0.28);
        }

        body.theme-marble {
            color: #2e2a28;
            background:
                radial-gradient(circle at 15% 12%, rgba(184, 122, 99, 0.16), transparent 34%),
                radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.45), transparent 30%),
                linear-gradient(165deg, #f6f2ee 0%, #ece7e1 45%, #f9f7f4 100%);
            --header-bg: #af7965;
            --header-fg: #fffaf7;
            --header-border: #9b6755;
            --secondary-color: #b87a63;
            --theme-glow: rgba(184, 122, 99, 0.28);
            --theme-overlay: linear-gradient(110deg, rgba(255, 255, 255, 0), rgba(255, 238, 227, 0.48), rgba(255, 255, 255, 0));
            --theme-sparkle: rgba(255, 247, 237, 0.95);
            --theme-table-even: rgba(243, 238, 232, 0.97);
            --theme-table-odd: rgba(255, 252, 247, 0.97);
            --theme-table-text: #2e2a28;
        }
        body.theme-marble .panel {
            background:
                linear-gradient(130deg, rgba(255, 255, 255, 0.98) 0%, rgba(245, 240, 234, 0.96) 100%),
                repeating-linear-gradient(
                    118deg,
                    rgba(130, 116, 110, 0.08) 0px,
                    rgba(130, 116, 110, 0.08) 2px,
                    rgba(255, 255, 255, 0) 2px,
                    rgba(255, 255, 255, 0) 14px
                );
            border-color: #c99a83;
            color: #2e2a28;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88), 0 8px 20px rgba(88, 62, 53, 0.2);
        }

        body.theme-gold {
            color: #fff7d1;
            background:
                radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.2), transparent 34%),
                radial-gradient(circle at 84% 14%, rgba(255, 231, 150, 0.1), transparent 30%),
                linear-gradient(165deg, #080603 0%, #0e0b08 38%, #1b1208 100%);
            --header-bg: #3a2b11;
            --header-fg: #fff7d1;
            --header-border: #a57b1d;
            --secondary-color: #d4af37;
            --theme-glow: rgba(212, 175, 55, 0.42);
            --theme-overlay: linear-gradient(110deg, rgba(255, 255, 255, 0), rgba(255, 223, 126, 0.36), rgba(255, 255, 255, 0));
            --theme-sparkle: rgba(255, 236, 173, 0.95);
            --theme-table-even: rgba(28, 21, 12, 0.96);
            --theme-table-odd: rgba(20, 15, 9, 0.96);
            --theme-table-text: #fff1be;
        }
        body.theme-gold .panel {
            background: linear-gradient(165deg, rgba(31, 23, 13, 0.97) 0%, rgba(24, 18, 11, 0.99) 100%);
            border-color: #b98a22;
            color: #fff7d1;
            box-shadow: inset 0 1px 0 rgba(255, 227, 137, 0.2), 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        body.theme-diamond {
            color: #eaf8ff;
            background:
                radial-gradient(circle at 18% 12%, rgba(127, 219, 255, 0.22), transparent 30%),
                radial-gradient(circle at 82% 10%, rgba(146, 193, 255, 0.24), transparent 34%),
                linear-gradient(160deg, #040a15 0%, #09111f 42%, #10233b 100%);
            --header-bg: #1a3556;
            --header-fg: #f4fdff;
            --header-border: #5ea7dd;
            --secondary-color: #7fdbff;
            --theme-glow: rgba(127, 219, 255, 0.38);
            --theme-overlay: linear-gradient(108deg, rgba(255, 255, 255, 0), rgba(206, 241, 255, 0.35), rgba(194, 214, 255, 0.22), rgba(255, 255, 255, 0));
            --theme-sparkle: rgba(230, 248, 255, 0.94);
            --theme-table-even: rgba(20, 37, 62, 0.96);
            --theme-table-odd: rgba(15, 30, 52, 0.96);
            --theme-table-text: #eaf8ff;
        }
        body.theme-diamond .panel {
            background: linear-gradient(164deg, rgba(24, 43, 70, 0.95) 0%, rgba(14, 30, 52, 0.99) 100%);
            border-color: #66b4e7;
            color: #eaf8ff;
            box-shadow: inset 0 1px 0 rgba(210, 244, 255, 0.24), 0 9px 22px rgba(4, 12, 24, 0.56);
        }

        body.theme-sophisticated .zebra-table tr:nth-child(even),
        body.theme-marble .zebra-table tr:nth-child(even),
        body.theme-gold .zebra-table tr:nth-child(even),
        body.theme-diamond .zebra-table tr:nth-child(even) {
            background-color: var(--theme-table-even, #f0f0f0);
            color: var(--theme-table-text, inherit);
        }
        body.theme-sophisticated .zebra-table tr:nth-child(odd),
        body.theme-marble .zebra-table tr:nth-child(odd),
        body.theme-gold .zebra-table tr:nth-child(odd),
        body.theme-diamond .zebra-table tr:nth-child(odd) {
            background-color: var(--theme-table-odd, #ffffff);
            color: var(--theme-table-text, inherit);
        }

        body.theme-sophisticated .panel-title,
        body.theme-marble .panel-title,
        body.theme-gold .panel-title,
        body.theme-diamond .panel-title {
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 10px var(--theme-glow, rgba(0, 0, 0, 0));
        }
        body.theme-sophisticated .panel-title::after,
        body.theme-marble .panel-title::after,
        body.theme-gold .panel-title::after,
        body.theme-diamond .panel-title::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--theme-overlay);
            transform: translateX(-120%);
            animation: luxe-sheen 8.5s linear infinite;
            pointer-events: none;
        }
        body.theme-sophisticated .tab-button,
        body.theme-marble .tab-button,
        body.theme-gold .tab-button,
        body.theme-diamond .tab-button,
        body.theme-sophisticated .tool-button,
        body.theme-marble .tool-button,
        body.theme-gold .tool-button,
        body.theme-diamond .tool-button {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 10px var(--theme-glow, rgba(0, 0, 0, 0));
            border-color: var(--header-border, #808080);
        }
        body.theme-sophisticated .goal-celebration-panel,
        body.theme-marble .goal-celebration-panel,
        body.theme-gold .goal-celebration-panel,
        body.theme-diamond .goal-celebration-panel {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22), 0 0 26px var(--theme-glow, rgba(0, 0, 0, 0.25)), 0 20px 48px rgba(0, 0, 0, 0.52);
        }
        body.theme-sophisticated #hud-cash,
        body.theme-marble #hud-cash,
        body.theme-gold #hud-cash,
        body.theme-diamond #hud-cash {
            text-shadow: 0 0 8px var(--theme-glow, rgba(0, 0, 0, 0.2));
            animation: luxe-twinkle 2.4s ease-in-out infinite;
        }
        body.theme-diamond #hud-networth {
            animation: luxe-prism 3.6s linear infinite;
        }

        @keyframes luxe-sheen {
            0% { transform: translateX(-120%); }
            55% { transform: translateX(-120%); }
            100% { transform: translateX(130%); }
        }
        @keyframes luxe-twinkle {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
        }
        @keyframes luxe-prism {
            0% { text-shadow: 0 0 8px rgba(127, 219, 255, 0.25), 0 0 0 rgba(194, 214, 255, 0); }
            33% { text-shadow: 0 0 10px rgba(127, 219, 255, 0.42), 0 0 12px rgba(255, 255, 255, 0.35); }
            66% { text-shadow: 0 0 8px rgba(194, 214, 255, 0.34), 0 0 10px rgba(127, 219, 255, 0.22); }
            100% { text-shadow: 0 0 8px rgba(127, 219, 255, 0.25), 0 0 0 rgba(194, 214, 255, 0); }
        }

        /* Panel title styling for the messages area */
        .panel-title {
            background: linear-gradient(90deg, var(--header-bg, #000080), var(--secondary-color, #0078d7));
            color: var(--header-fg, white);
            padding: 4px 6px;
            font-weight: bold;
            border-bottom: 1px solid var(--header-border, #808080);
            font-size: var(--font-title);
        }

        /* Zebra table styling and sticky header */
        .zebra-table {
            border-collapse: collapse;
            width: 100%;
        }
        .zebra-table th,
        .zebra-table td {
            padding: 2px 4px;
            border: 1px solid var(--header-border, #808080);
            font-size: var(--font-table);
        }
        .zebra-table tr:nth-child(even) {
            background-color: #f0f0f0;
        }
        .zebra-table tr:nth-child(odd) {
            background-color: #ffffff;
        }
        .zebra-table th {
            background-color: var(--header-bg, #000080);
            color: var(--header-fg, #ffffff);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .market-row-selected { 
            outline: 2px solid var(--secondary-color, #0078d7); 
            outline-offset: -2px; 
        } 
        .market-row-pulse { 
            animation: fx-row-pulse 220ms ease-out; 
        } 
        @keyframes fx-row-pulse { 
            0% { background-color: #fff4b0; } 
            100% { background-color: inherit; } 
        } 

        /* Farm styling for the Minesweeper‑like 9×9 board used in the Farmer's Market tab */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid var(--header-border, #808080);
            cursor: inherit;
        }
        .grid-cell { 
            box-sizing: border-box; 
            /* 3D button style reminiscent of Windows 98: light top/left, dark bottom/right */
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: inherit;
            user-select: none;
            position: relative; 
            overflow: hidden; 
            transition: transform 80ms ease-out, box-shadow 80ms ease-out; 
        } 
        @media (hover: hover) and (pointer: fine) { 
            .grid-cell:hover { 
                transform: translateY(-1px); 
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 0 rgba(0, 0, 0, 0.15); 
            } 
        } 
        .grid-cell.revealed {
            /* Invert bevel to appear sunken when revealed */
            background-color: #663931;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .grid-cell img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .grid-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 2;
        }
        .rarity-border {
            box-shadow: inset 0 0 0 3px var(--rarity-color, #ffffff);
        }
        .rarity-frame {
            position: absolute;
            inset: 0;
            border: 3px solid var(--rarity-color, #ffffff);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 4;
        }
        .rarity-common {
            --rarity-color: #ffffff;
        }
        .rarity-uncommon {
            --rarity-color: #c0c0c0;
        }
        .rarity-rare {
            --rarity-color: #d4af37;
        }
        .rarity-mythic { 
            --rarity-color: #a855f7; 
        } 
        .grid-cell.rarity-rare::after { 
            content: ''; 
            position: absolute; 
            inset: -20%; 
            background: linear-gradient( 
                120deg, 
                rgba(255, 255, 255, 0), 
                rgba(255, 255, 255, 0.45), 
                rgba(255, 255, 255, 0) 
            ); 
            opacity: 0.35; 
            transform: translateX(-60%); 
            animation: fx-shimmer 3s linear infinite; 
            pointer-events: none; 
            mix-blend-mode: screen; 
        } 
        .rarity-holo { 
            position: absolute; 
            inset: 1px; 
            pointer-events: none; 
            z-index: 3; 
            background: linear-gradient(
                120deg,
                rgba(168, 85, 247, 0.0),
                rgba(168, 85, 247, 0.35),
                rgba(120, 60, 200, 0.6),
                rgba(168, 85, 247, 0.35),
                rgba(168, 85, 247, 0.0)
            );
            background-size: 200% 200%;
            mix-blend-mode: screen;
            animation: holo-shine 3.5s linear infinite;
        }
        @keyframes holo-shine { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        } 
        @keyframes fx-shimmer { 
            0% { transform: translateX(-70%); } 
            100% { transform: translateX(70%); } 
        } 
        .farm-toolbar {
            display: flex;
            gap: 4px;
            margin: 4px 0;
            width: 100%;
            max-width: var(--grid-size, 580px);
            box-sizing: border-box;
            align-items: center;
        }
        .tool-button {
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #d4d0c8;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
        }
        .tool-button.active {
            background-color: #c0c0c0;
            border-left: 1px solid #808080;
            border-top: 1px solid #808080;
            border-right: 1px solid white;
            border-bottom: 1px solid white;
        }
        .tool-button img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .progress-indicator {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            border-radius: 0;
            box-shadow: inset -2px -2px #dfdfdf, inset 2px 2px grey;
            height: 32px;
            padding: 4px;
            position: relative;
            background-color: #c0c0c0;
            display: flex;
        }
        .farm-toolbar .progress-indicator {
            padding: 2px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .energy-segment {
            flex: 1 1 0;
            background-color: var(--energy-empty);
            box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff;
        }
        .energy-segment.filled {
            background-color: var(--energy-fill);
        }
        .chat-row {
            display: flex;
            gap: 0;
            align-items: stretch;
            height: var(--messages-height, 88px);
        }
        .chat-avatar {
            width: var(--messages-height, 88px);
            height: 100%;
            flex: 0 0 var(--messages-height, 88px);
            display: block;
        }
        .market-header {
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #market-header > span {
            display: none;
        }
        .market-stats {
            display: flex;
            gap: 12px;
            font-size: var(--font-ui);
            margin-top: 4px;
        }
        .market-tabs {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .tab-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            font-size: var(--font-ui);
            background-color: #c0c0c0;
            border-left: 1px solid white;
            border-top: 1px solid white;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            min-height: 44px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .tab-button.active {
            background-color: #d4d0c8;
            border-bottom-color: #d4d0c8;
        }
        .feedback-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            z-index: 200;
